[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campaign-builder"
version = "0.1.0"
description = "Campaign Builder - An agent-based system for building simulation campaigns"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Campaign Builder Team"}
]
keywords = ["simulation", "campaign", "agent", "lammps", "quantum-espresso"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "anthropic>=0.39.0",
    "claude-agent-sdk>=0.1.18",
    "pydantic>=2.0",
    "httpx>=0.24.0",
    "pymupdf>=1.23.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
campaign-builder = "campaign_builder.cli:main_sync"

[project.urls]
Homepage = "https://github.com/campaign-builder/campaign-builder"
Documentation = "https://github.com/campaign-builder/campaign-builder#readme"
Repository = "https://github.com/campaign-builder/campaign-builder"

[tool.hatch.build.targets.wheel]
packages = ["campaign_builder", "lammps_reaper"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["campaign_builder", "lammps_reaper"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "lammps_reaper/tests"]
addopts = "-v --tb=short"
